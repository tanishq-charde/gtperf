[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtperf"
version = "0.3.0"
description = "Gas turbine performance toolkit: cycle modelling, site prediction, test validation and fleet analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
plots = ["matplotlib"]  # also needed for pass-off report figures
dev = ["pytest", "matplotlib", "cantera"]

[project.scripts]
gtperf = "gtperf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
