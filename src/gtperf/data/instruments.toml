# --- fuel mass flow: Coriolis meter --------------------------------------------
[[instrument]]
tag = "W_fuel"
group = "Fuel gas Coriolis meter"
quantity = "Fuel mass flow"
description = "Coriolis mass flow meter on fuel gas"
unit = "kg/s"
relative = true
nominal = 0.8
noise = 0.003

[[instrument.component]]
name = "Coriolis gas mass flow accuracy"
standard = "Micro Motion ELITE CMFS specification"
class = "gas"
formula = "±0.25 % of rate"
of_reading = 0.0025
distribution = "rectangular"
source = "https://www.instrumart.com/products/42309/micro-motion-elite-coriolis-flow-meters"
note = "Zero stability (which adds at low flow) was not verified and is not included."

[instrument.component.certificate]
