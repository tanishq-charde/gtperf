nominal = 12.0
noise = 0.1

[[instrument.component]]
name = "DP transmitter reference accuracy"
standard = "Rosemount 3051S specification"
class = "Classic performance class"
formula = "±0.035 % of calibrated span (span 50 mbar)"
of_span = 0.00035
span = 50.0
distribution = "rectangular"
source = "https://emerson.com:443/documents/automation/product-data-sheet-rosemount-3051s-series-of-instrumentation-en-73154.pdf"
