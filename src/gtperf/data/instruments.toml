nominal = 5.0
noise = 0.05

[[instrument.component]]
name = "DP transmitter reference accuracy"
standard = "Rosemount 3051S specification"
class = "Classic performance class"
formula = "±0.035 % of calibrated span (span 25 mbar)"
of_span = 0.00035
span = 25.0
distribution = "rectangular"
source = "https://emerson.com:443/documents/automation/product-data-sheet-rosemount-3051s-series-of-instrumentation-en-73154.pdf"
note = "Reference accuracy only. Rangedown, static-pressure and installation (tapping) effects are not included."

[[instrument]]
tag = "dP_exhaust"
group = "Exhaust back-pressure transmitter"
quantity = "Exhaust pressure loss"
description = "differential pressure transmitter, calibrated span 0-50 mbar"
