# --- fuel lower heating value: gas chromatograph + ISO 6976 -----------------------
[[instrument]]
tag = "LHV"
group = "Gas chromatograph LHV"
quantity = "Fuel lower heating value"
description = "on-line gas chromatograph, heating value by ISO 6976"
unit = "MJ/kg"
relative = true
nominal = 47.0
noise = 0.0002

[[instrument.component]]
name = "Mass-basis heating value from composition"
standard = "ISO 6976:2016 method"
class = "u = 0.06 % (k = 1)"
formula = "u = 0.030 / 48.977 MJ/kg"
of_reading = 0.0006
distribution = "normal"
coverage_k = 1.0
source = "https://www.mdpi.com/2674-0389/4/1/1"
verified = false
note = "Standard uncertainty of the mass-basis superior calorific value for the worked example in van der Veen (VSL), Methane 4(1), 2025, with composition correlations. The author states the example is not intended to represent typical performance, and the LHV is assumed to have the same relative uncertainty. Replace with the site GC's own ISO 6976 / ISO 6974 uncertainty."

# --- electrical power: CTs, VTs and revenue meter ----------------------------------
[[instrument]]
tag = "P_elec"
group = "Power metering"
quantity = "Electrical power"
description = "generator terminal power: measuring CTs and VTs with a class 0.2S meter"
unit = "kW"
relative = true
nominal = 12900.0
noise = 0.0015

[[instrument.component]]
name = "Current transformers (ratio and phase)"
standard = "IEC 61869-2"
class = "class 0.2"
formula = "±(0.2 % + tan φ · 10′) at 100-120 % In, pf 0.9 → ±0.341 %"
of_reading = 0.00341
distribution = "rectangular"
source = "https://imsi.p.lodz.pl/sites/i25/files/2023-12/cw2_ v0318.pdf"
note = "Class 0.2 limits from PN-EN 61869-2 Table 1: ±0.2 % / ±10 min at 100-120 % In (±0.35 % / ±15 min at 20 %). Power factor 0.9 and CT loading of 100-120 % at base load are test-bed assumptions."

[instrument.component.certificate]
id = "TB2-CT-2511-01"
as_found_error = -0.03
expanded_uncertainty = 0.06
k = 2
date = 2025-11-18
laboratory = "illustrative instrument-transformer laboratory; power error of the CT set at rated burden and pf 0.9"

[[instrument.component]]
name = "Voltage transformers (ratio and phase)"
standard = "IEC 61869-3 (limits as in IEC 60044-2)"
class = "class 0.2"
formula = "±(0.2 % + tan φ · 10′) at 80-120 % Un, pf 0.9 → ±0.341 %"
of_reading = 0.00341
distribution = "rectangular"
source = "https://www.kth.se/social/files/55f12ed5f2765409c53d3c14/2%20Instrument%20transformers.pdf"
note = "The source quotes IEC 60044-2 (predecessor of IEC 61869-3): ±0.2 % ratio, ±10 min phase. That IEC 61869-3 keeps the same class 0.2 limits was not checked against its text."

[instrument.component.certificate]
id = "TB2-VT-2511-02"
as_found_error = 0.02
expanded_uncertainty = 0.05
k = 2
date = 2025-11-18

[[instrument.component]]
name = "Active energy meter"
standard = "IEC 62053-22"
class = "class 0.2S"
formula = "±0.2 % (pf 1), ±0.3 % (pf 0.5 ind.) for 0.05-0.1 In ≤ I ≤ Imax; ±0.3 % used at pf 0.9"
of_reading = 0.003
distribution = "rectangular"
source = "https://assets.elexon.co.uk/wp-content/uploads/sites/11/2012/02/28171745/redlining_for_cp1319_cop4_v0.1.pdf"
note = "Elexon Code of Practice 4 Table C1 (citing BS EN 62053-22). No limit is tabulated at pf 0.9, so the pf 0.5 limit is used."

[instrument.component.certificate]
id = "TB2-MTR-2603-03"
as_found_error = 0.04
expanded_uncertainty = 0.08
k = 2
date = 2026-03-09

# --- exhaust temperature rake: 12 type K thermocouples ----------------------------
[[instrument]]
tags = ["T_exh_01", "T_exh_02", "T_exh_03", "T_exh_04", "T_exh_05", "T_exh_06",
        "T_exh_07", "T_exh_08", "T_exh_09", "T_exh_10", "T_exh_11", "T_exh_12"]
group = "Exhaust thermocouple rake"
quantity = "Exhaust temperature"
description = "exhaust thermocouple, type K, mineral insulated"
unit = "degC"
nominal = 550.0
noise = 0.5

[[instrument.component]]
name = "Thermocouple tolerance"
standard = "IEC 60584-1"
class = "type K class 1"
formula = "±1.5 °C (-40 to 375 °C) or ±0.004·|t| (375 to 1000 °C)"
fixed = 1.5
of_reading = 0.004
combine = "max"
distribution = "rectangular"
source = "https://tcdirect.co.uk/thermocouple-sensors/thermocouple-accuracies.aspx"
note = "Errors are taken as independent between thermocouples (assumes they are not cut from one wire batch); a shared wire-batch error would not average down across the rake."

