# Pass-off test-bed instrument list.
#
# Every systematic uncertainty below comes from a standard's accuracy class or a
# manufacturer's published specification (each with the URL where the number was
# checked on 2026-10-19), or from a calibration certificate for that instrument.
#
# Conventions
# - Tolerances are +/- bounds in the instrument's units. "sum": fixed + of_reading*|x|
#   + of_span*span. "max": the greater of the terms (IEC 60584-1 style).
# - distribution: "rectangular" (bound / sqrt(3)) when the source only promises the
#   error stays within the limits; "normal" with coverage_k when the source states the
#   bound as an expanded uncertainty.
# - Certificates: as_found_error (reading minus reference) and expanded_uncertainty
#   with k. For relative instruments (relative = true) both are in % of reading. An
#   in-date certificate overrides the class tolerance and its error is subtracted
#   from the reading. Out-of-date certificates are ignored and flagged.
# - The certificates in this file are ILLUSTRATIVE records for a synthetic test bed:
#   plausible values for an accredited laboratory, not real calibrations.
# - The calibration interval (365 days) is a test-bed policy, not a standard.
# - noise: random standard uncertainty per 1 Hz sample, used ONLY by the synthetic
#   data generator. The analysis estimates random uncertainty from the logged data.
# - verified = false marks a number that is in the cited source but whose
#   applicability could not be confirmed (see the note).
#
# Not verified and therefore not used: ASME PTC 22-2014 Table 1-1 test uncertainty
# limits (the code is not freely available; the public preview does not contain them).

calibration_interval_days = 365

# --- inlet air temperature: three redundant Pt100 RTDs -------------------------
[[instrument]]
tags = ["T_amb_1", "T_amb_2", "T_amb_3"]
group = "Inlet air RTDs"
quantity = "Inlet air temperature"
description = "inlet air Pt100 RTD, 4-wire"
unit = "degC"
nominal = 15.0
noise = 0.05

[[instrument.component]]
name = "Pt100 element and readout (loop)"
standard = "IEC 60751"
class = "class A"
formula = "±(0.15 + 0.002·|t|) °C"
fixed = 0.15
of_reading = 0.002
combine = "sum"
distribution = "rectangular"
source = "https://reotemp.com/2025/06/24/rtd-tolerance-classes-explained"
note = "Class A validity range quoted by the source as -30 to 300 °C; test ambients stay inside it."

[instrument.component.certificates.T_amb_1]
id = "TB2-RTD-2604-01"
as_found_error = 0.03
expanded_uncertainty = 0.05
k = 2
date = 2026-04-20
laboratory = "illustrative UKAS-style temperature lab (comparison in stirred bath at 0, 20, 40 °C)"

[instrument.component.certificates.T_amb_2]
id = "TB2-RTD-2604-02"
as_found_error = -0.05
expanded_uncertainty = 0.05
k = 2
date = 2026-04-20

[instrument.component.certificates.T_amb_3]
id = "TB2-RTD-2604-03"
as_found_error = 0.02
expanded_uncertainty = 0.05
k = 2
date = 2026-04-20

# --- barometric pressure -------------------------------------------------------
[[instrument]]
tag = "P_amb"
group = "Barometer"
quantity = "Barometric pressure"
description = "digital barometer (Vaisala PTB330 class A type)"
unit = "mbar"
nominal = 1013.25
noise = 0.05

[[instrument.component]]
name = "Barometer total accuracy"
standard = "Vaisala PTB330 specification"
class = "class A, 500-1100 hPa, -40 to +60 °C"
formula = "±0.15 hPa"
fixed = 0.15
distribution = "rectangular"
source = "https://docs.vaisala.com/r/M210855EN-E/en-US/GUID-0A761DB8-D737-455F-B497-15DDB047E696"
note = "The specification does not state a coverage factor for total accuracy, so it is treated as a bound."

# --- relative humidity -----------------------------------------------------------
[[instrument]]
tag = "RH"
group = "Humidity probe"
quantity = "Relative humidity"
description = "capacitive humidity probe (Vaisala HMP155 type)"
unit = "%"
nominal = 60.0
noise = 0.3

[[instrument.component]]
name = "Humidity probe accuracy"
standard = "Vaisala HMP155 specification"
class = "-20 to +40 °C"
formula = "±(1.0 + 0.008·reading) %RH"
fixed = 1.0
of_reading = 0.008
combine = "sum"
distribution = "rectangular"
source = "https://s.campbellsci.com/documents/au/product-brochures/b_hmp155.pdf"
note = "Includes non-linearity, hysteresis and repeatability (per the datasheet)."

